<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Portal - That SEC Podcast</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0a1120;
      --bg-card: #131d31;
      --bg-card-inner: #19263e;
      --accent-gold: #fbbf24;
      --accent-gold-hover: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #22324f;
      --success: #4ade80;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 1.5rem 1rem 3rem;
      display: flex;
      justify-content: center;
      min-height: 100dvh;
    }

    .container {
      width: 100%;
      max-width: 550px;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .back-link {
      display: inline-block;
      color: var(--accent-gold);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    .sub-header {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .card-panel {
      background: var(--bg-card);
      padding: 1.25rem;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .control-group label {
      display: block;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    select, input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      background: #0d1527;
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      font-size: 1rem;
      font-weight: 700;
      outline: none;
    }

    input[type="password"] {
      color: var(--text-main);
      font-weight: normal;
      margin-bottom: 1.25rem;
    }

    input[type="password"]:focus {
      border-color: var(--accent-gold);
    }

    select option {
      background: #0d1527;
      color: var(--text-main);
    }

    .game-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card.is-locked {
      border: 1.5px solid var(--accent-gold);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
    }

    .game-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    .game-title {
      color: var(--accent-gold);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-lock-toggle {
      background: #0e1728;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .btn-lock-toggle:hover {
      border-color: var(--accent-gold);
      color: var(--text-main);
    }

    .btn-lock-toggle.active {
      background: var(--accent-gold);
      color: #0a1120;
      border-color: var(--accent-gold);
      font-weight: 900;
    }

    .game-detail {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .pick-buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .btn-pick {
      background: #0e1728;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 0.85rem 0.4rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-pick:hover {
      border-color: #3b4d71;
      color: var(--text-main);
    }

    .btn-pick.selected {
      background: var(--accent-gold);
      color: #0a1120;
      font-weight: 900;
      border-color: var(--accent-gold);
    }

    /* Score Input Row */
    .score-inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    .score-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .score-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .score-field {
      width: 100%;
      background: #0d1527;
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      padding: 0.45rem;
      border-radius: 6px;
      outline: none;
    }

    .score-field:focus {
      border-color: var(--accent-gold);
    }

    .btn-save-all {
      width: 100%;
      background: linear-gradient(180deg, #fcd34d 0%, #fbbf24 100%);
      color: #0a1120;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 1.1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0 #b45309;
      transition: transform 0.1s ease;
    }

    .btn-save-all:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b45309;
    }

    .status-alert {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="index.html" class="back-link">&larr; Back to Leaderboard</a>
      <h1>HOST PICKS PORTAL</h1>
      <p class="sub-header" id="portalSubHeading">Week 1 Picks, Scores & Lock Submission</p>
    </header>

    <div class="card-panel">
      <div class="controls-grid">
        <div class="control-group">
          <label for="weekSelect">Select Week:</label>
          <select id="weekSelect" onchange="onWeekChange()">
            <option value="1">Week 1</option>
            <option value="2">Week 2</option>
            <option value="3">Week 3</option>
            <option value="4">Week 4</option>
            <option value="5">Week 5</option>
            <option value="6">Week 6</option>
            <option value="7">Week 7</option>
            <option value="8">Week 8</option>
            <option value="9">Week 9</option>
            <option value="10">Week 10</option>
            <option value="11">Week 11</option>
            <option value="12">Week 12</option>
            <option value="13">Week 13</option>
            <option value="14">Week 14</option>
          </select>
        </div>

        <div class="control-group">
          <label for="hostSelect">Submitting As:</label>
          <select id="hostSelect" onchange="onHostChange()">
            <option value="Mike">Mike</option>
            <option value="Shane">Shane</option>
            <option value="Steven">Steven</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <label for="hostPin">Host Security PIN:</label>
        <input type="password" id="hostPin" placeholder="Enter Host PIN" />
      </div>

      <div id="gamesContainer">
        <div style="text-align: center; color: var(--text-muted); padding: 2rem 0;">Loading schedule...</div>
      </div>

      <button type="button" class="btn-save-all" onclick="saveHostSelections()">Save Host Picks</button>
      <div id="statusAlert" class="status-alert"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kxkctllysuxertyjjppd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DW2n3YQdAW6jEYNTP-Jm4Q_ejgFJ7nd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const secCanonicalList = [
      "Alabama", "Arkansas", "Auburn", "Florida", "Georgia", "Kentucky",
      "LSU", "Ole Miss", "Mississippi State", "Miss State", "Missouri",
      "Oklahoma", "South Carolina", "Tennessee", "Texas", "Texas A&M", "Vanderbilt"
    ];

    let currentSchedule = [];
    let hostPicks = {};
    let hostScores = {};
    let currentLockGameId = null;

    function cleanTeamName(name) {
      if (!name) return "";
      const lower = name.toLowerCase().trim();
      if (lower.includes("pine bluff") || lower === "uapb" || lower.includes("peanut")) {
        return "Arkansas Peanut Butter (Pine Bluff)";
      }
      return name;
    }

    function isSecTeam(teamName) {
      if (!teamName) return false;
      const lower = teamName.toLowerCase().trim();
      return secCanonicalList.some(sec => lower.includes(sec.toLowerCase()) || sec.toLowerCase().includes(lower));
    }

    async function fetchEspnSchedule(week) {
      try {
        const url = `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=8&seasontype=2&dates=2026&week=${week}&limit=100`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.events || data.events.length === 0) return [];

        const rawGames = [];

        data.events.forEach(ev => {
          const comp = ev.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === 'home');
          const away = comp.competitors.find(c => c.homeAway === 'away');

          const homeName = cleanTeamName(home.team.shortDisplayName || home.team.name);
          const awayName = cleanTeamName(away.team.shortDisplayName || away.team.name);

          let teamA = homeName;
          let teamB = awayName;

          if (!isSecTeam(homeName) && isSecTeam(awayName)) {
            teamA = awayName;
            teamB = homeName;
          }

          const isFinal = comp.status && comp.status.type && comp.status.type.completed;
          const odds = comp.odds && comp.odds[0]?.details ? comp.odds[0].details : 'Line: TBD';
          const venue = comp.venue ? `${comp.venue.address.city}, ${comp.venue.address.state}` : '';
          
          let time = "TBD";
          if (comp.date) {
            time = new Date(comp.date).toLocaleDateString([], { month: 'numeric', day: 'numeric' }) + ' ' + 
                   new Date(comp.date).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          }

          rawGames.push({
            teamA: teamA,
            teamB: teamB,
            detail: isFinal ? `${time} | ${venue}` : `${time} | ${odds} | ${venue}`
          });
        });

        rawGames.sort((a, b) => a.teamA.localeCompare(b.teamA));

        return rawGames.map((g, idx) => ({
          id: idx + 1,
          teamA: g.teamA,
          teamB: g.teamB,
          detail: g.detail
        }));
      } catch (e) {
        console.error("ESPN schedule error:", e);
        return [];
      }
    }

    async function loadSchedule() {
      const weekNum = parseInt(document.getElementById("weekSelect").value, 10);
      document.getElementById("portalSubHeading").textContent = `Week ${weekNum} Picks, Scores & Lock Submission`;

      currentSchedule = await fetchEspnSchedule(weekNum);

      renderCards();
      await fetchExistingHostData();
    }

    function renderCards() {
      const container = document.getElementById("gamesContainer");
      if (currentSchedule.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 1.5rem 0;">No scheduled games found for this week.</div>`;
        return;
      }

      container.innerHTML = "";

      currentSchedule.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.id = `card_${game.id}`;

        card.innerHTML = `
          <div class="game-header-row">
            <span class="game-title">GAME ${game.id}: ${game.teamA} VS ${game.teamB}</span>
            <button type="button" class="btn-lock-toggle" id="lock_btn_${game.id}" onclick="toggleLock(${game.id})">
              Lock of Week
            </button>
          </div>
          ${game.detail ? `<span class="game-detail">${game.detail}</span>` : ''}
          <div class="pick-buttons-grid">
            <button type="button" class="btn-pick" id="btn_${game.id}_A" onclick="selectTeam(${game.id}, '${game.teamA}')">
              ${game.teamA}
            </button>
            <button type="button" class="btn-pick" id="btn_${game.id}_B" onclick="selectTeam(${game.id}, '${game.teamB}')">
              ${game.teamB}
            </button>
          </div>
          <div class="score-inputs-grid">
            <div class="score-group">
              <span class="score-label">${game.teamA} Score</span>
              <input type="number" min="0" max="99" class="score-field" id="score_${game.id}_A" placeholder="--" oninput="onScoreInput(${game.id}, '${game.teamA}', '${game.teamB}')" />
            </div>
            <div class="score-group">
              <span class="score-label">${game.teamB} Score</span>
              <input type="number" min="0" max="99" class="score-field" id="score_${game.id}_B" placeholder="--" oninput="onScoreInput(${game.id}, '${game.teamA}', '${game.teamB}')" />
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectTeam(gameId, teamName) {
      hostPicks[gameId] = teamName;
      const btnA = document.getElementById(`btn_${gameId}_A`);
      const btnB = document.getElementById(`btn_${gameId}_B`);

      if (btnA && btnB) {
        if (btnA.textContent.trim() === teamName) {
          btnA.classList.add("selected");
          btnB.classList.remove("selected");
        } else {
          btnB.classList.add("selected");
          btnA.classList.remove("selected");
        }
      }
    }

    function onScoreInput(gameId, teamA, teamB) {
      const valA = document.getElementById(`score_${gameId}_A`).value;
      const valB = document.getElementById(`score_${gameId}_B`).value;

      if (!hostScores[gameId]) hostScores[gameId] = {};
      hostScores[gameId].teamA = valA;
      hostScores[gameId].teamB = valB;

      const numA = parseInt(valA, 10);
      const numB = parseInt(valB, 10);

      if (!isNaN(numA) && !isNaN(numB)) {
        if (numA > numB) selectTeam(gameId, teamA);
        else if (numB > numA) selectTeam(gameId, teamB);
      }
    }

    function toggleLock(gameId) {
      currentLockGameId = (currentLockGameId === gameId) ? null : gameId;
      refreshLockVisuals();
    }

    function refreshLockVisuals() {
      currentSchedule.forEach(game => {
        const card = document.getElementById(`card_${game.id}`);
        const lockBtn = document.getElementById(`lock_btn_${game.id}`);

        if (card && lockBtn) {
          if (currentLockGameId === game.id) {
            card.classList.add("is-locked");
            lockBtn.classList.add("active");
            lockBtn.textContent = "★ Lock Selected";
          } else {
            card.classList.remove("is-locked");
            lockBtn.classList.remove("active");
            lockBtn.textContent = "Lock of Week";
          }
        }
      });
    }

    function onWeekChange() {
      hostPicks = {};
      hostScores = {};
      currentLockGameId = null;
      document.getElementById("statusAlert").textContent = "";
      loadSchedule();
    }

    function onHostChange() {
      hostPicks = {};
      hostScores = {};
      currentLockGameId = null;
      document.querySelectorAll(".btn-pick").forEach(btn => btn.classList.remove("selected"));
      document.querySelectorAll(".score-field").forEach(inp => inp.value = "");
      document.getElementById("statusAlert").textContent = "";
      refreshLockVisuals();
      fetchExistingHostData();
    }

    async function fetchExistingHostData() {
      const hostName = document.getElementById("hostSelect").value;
      const weekNum = parseInt(document.getElementById("weekSelect").value, 10);

      try {
        const { data, error } = await supabaseClient
          .from("picks")
          .select("*")
          .eq("week_number", weekNum)
          .eq("user_name", hostName)
          .maybeSingle();

        if (error) throw error;

        if (data && data.picks) {
          const raw = typeof data.picks === 'object' ? data.picks : JSON.parse(data.picks);
          hostPicks = { ...raw };
          hostScores = raw.scores || {};

          currentSchedule.forEach(g => {
            const team = hostPicks[g.id] || hostPicks[String(g.id)];
            if (team) {
              selectTeam(g.id, team);
            }

            const gScore = hostScores[g.id] || hostScores[String(g.id)];
            if (gScore) {
              const inpA = document.getElementById(`score_${g.id}_A`);
              const inpB = document.getElementById(`score_${g.id}_B`);
              if (inpA && gScore.teamA !== undefined) inpA.value = gScore.teamA;
              if (inpB && gScore.teamB !== undefined) inpB.value = gScore.teamB;
            }
          });

          if (hostPicks.lock_game_id) {
            currentLockGameId = parseInt(hostPicks.lock_game_id, 10);
            refreshLockVisuals();
          }
        }
      } catch (e) {
        console.error("Error fetching host data:", e);
      }
    }

    async function saveHostSelections() {
      const pinInput = document.getElementById("hostPin").value.trim();
      const hostName = document.getElementById("hostSelect").value;
      const weekNum = parseInt(document.getElementById("weekSelect").value, 10);
      const statusAlert = document.getElementById("statusAlert");

      if (pinInput.toUpperCase() !== "SEC2026") {
        statusAlert.style.color = "var(--danger)";
        statusAlert.textContent = "Invalid Host Security PIN.";
        return;
      }

      const pickedKeys = Object.keys(hostPicks).filter(k => k !== 'lock_game_id' && k !== 'scores');
      if (pickedKeys.length < currentSchedule.length) {
        statusAlert.style.color = "var(--danger)";
        statusAlert.textContent = `Please make picks for all ${currentSchedule.length} games.`;
        return;
      }

      currentSchedule.forEach(g => {
        const inpA = document.getElementById(`score_${g.id}_A`);
        const inpB = document.getElementById(`score_${g.id}_B`);
        if (inpA && inpB && inpA.value !== "" && inpB.value !== "") {
          if (!hostScores[g.id]) hostScores[g.id] = {};
          hostScores[g.id].teamA = inpA.value;
          hostScores[g.id].teamB = inpB.value;
        }
      });

      hostPicks.lock_game_id = currentLockGameId;
      hostPicks.scores = hostScores;

      statusAlert.style.color = "var(--text-muted)";
      statusAlert.textContent = "Saving...";

      try {
        const { data: existing, error: checkError } = await supabaseClient
          .from("picks")
          .select("id")
          .eq("week_number", weekNum)
          .eq("user_name", hostName)
          .maybeSingle();

        if (checkError) throw checkError;

        let saveError = null;

        if (existing && existing.id) {
          const { error } = await supabaseClient
            .from("picks")
            .update({
              is_host: true,
              picks: hostPicks,
              created_at: new Date().toISOString()
            })
            .eq("id", existing.id);

          saveError = error;
        } else {
          const { error } = await supabaseClient
            .from("picks")
            .insert({
              user_name: hostName,
              week_number: weekNum,
              is_host: true,
              picks: hostPicks,
              created_at: new Date().toISOString()
            });

          saveError = error;
        }

        if (saveError) throw saveError;

        statusAlert.style.color = "var(--success)";
        statusAlert.textContent = `Week ${weekNum} picks, scores & Lock saved for ${hostName}!`;
      } catch (err) {
        statusAlert.style.color = "var(--danger)";
        statusAlert.textContent = `Error: ${err.message}`;
      }
    }

    loadSchedule();
  </script>
</body>
</html>
