<!DOCTYPE html>
<html lang="en" class="page-makepicks">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-site-text="Make Picks - {name}">Make Picks - That SEC Podcast</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- styles.css, config.js, common.js, sec.js: see load.js -->
  <script src="load.js" data-load="sec.js"></script>
</head>
<body>

  <div class="container narrow">
    <header>
      <a href="index.html" class="back-link">&larr; Back to Leaderboard</a>
      <h1 id="pageHeading">SUBMIT PICKS</h1>
      <p class="sub-header" id="pageSubHeading">Make your selections</p>
    </header>

    <div id="lockCountdown" class="lock-countdown" style="display: none;"></div>

    <div class="pick-format-banner">
      <div class="pick-format-text">
        <span class="pick-format-highlight">Straight-Up Picks Only:</span> Select the outright winner for each game (not against the spread). Betting lines are shown for reference only.
      </div>
    </div>

    <div class="hub-action-row centered">
      <button type="button" class="btn-ctrl" onclick="openSchedulePicker()">Schedules</button>
      <button type="button" class="btn-ctrl" onclick="openRankings()">Top 25</button>
      <button type="button" class="btn-ctrl" onclick="openStandings()">SEC Standings</button>
    </div>

    <div class="card">
      <div class="user-input-group">
        <label for="userNameInput">Your Name:</label>
        <div class="name-input-wrapper">
          <input type="text" class="form-field" id="userNameInput" placeholder="e.g., @CousinDan or VolFan99" data-site-attr="placeholder:e.g., @{one}Dan or VolFan99" autocomplete="off" required />
          <div id="nameSuggestions" class="name-suggestions"></div>
        </div>
        <div class="name-reminder">Checking your sign-in...</div>
      </div>

      <div class="hub-action-row centered">
        <button type="button" class="btn-ctrl" onclick="setAllCardDetails(true)">Expand All Details</button>
        <button type="button" class="btn-ctrl" onclick="setAllCardDetails(false)">Collapse All</button>
      </div>

      <div id="gamesList">
        <div style="text-align: center; color: var(--text-muted); padding: 2rem 0;">Loading schedule...</div>
      </div>

      <button type="button" class="btn-submit" id="submitBtn" onclick="submitBallot()">Submit Ballot</button>
      <div id="statusAlert" class="status-alert"></div>
    </div>
  </div>

  <div id="nameMatchModal" class="name-match-modal-overlay">
    <div class="name-match-modal">
      <div class="name-match-modal-title">Is this you?</div>
      <div class="name-match-modal-text" id="nameMatchModalText"></div>
      <div class="name-match-modal-buttons">
        <button type="button" class="btn-modal-primary" id="nameMatchModalYes">Yes, that's me</button>
        <button type="button" class="btn-modal-secondary" id="nameMatchModalNo">No, use what I typed</button>
      </div>
    </div>
  </div>

  <div id="infoOverlay" class="team-sched-overlay" onclick="if (event.target === this) closeInfoModal()">
    <div class="team-sched-modal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
      <div class="team-sched-header">
        <div class="team-sched-title" id="infoTitle"></div>
        <button type="button" class="team-sched-close" onclick="closeInfoModal()" aria-label="Close">&times;</button>
      </div>
      <div class="team-sched-body" id="infoBody"></div>
    </div>
  </div>

  <div id="teamSchedOverlay" class="team-sched-overlay" onclick="if (event.target === this) closeTeamSchedule()">
    <div class="team-sched-modal" role="dialog" aria-modal="true" aria-labelledby="teamSchedTitle">
      <div class="team-sched-header">
        <img id="teamSchedLogo" src="" alt="" style="display:none;" />
        <div class="team-sched-title" id="teamSchedTitle"></div>
        <button type="button" class="team-sched-close" onclick="closeTeamSchedule()" aria-label="Close">&times;</button>
      </div>
      <div class="team-sched-body" id="teamSchedBody"></div>
    </div>
  </div>

  <script>siteScript("makepicks.js");</script>
</body>
</html>
