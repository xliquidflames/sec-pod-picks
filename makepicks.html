<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make Picks - That SEC Podcast</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0a1120;
      --bg-card: #131d31;
      --bg-card-inner: #19263e;
      --accent-gold: #fbbf24;
      --accent-gold-hover: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #22324f;
      --success: #4ade80;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 1.5rem 1rem 3rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 550px;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .back-link {
      display: inline-block;
      color: var(--accent-gold);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    .sub-header {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .card-panel {
      background: var(--bg-card);
      padding: 1.25rem;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    .user-input-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: #0d1527;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-gold);
    }

    .game-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .game-title {
      color: var(--accent-gold);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 0.25rem;
    }

    .game-detail {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .pick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .btn-pick {
      background: #0e1728;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 0.85rem 0.4rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-pick:hover {
      border-color: #3b4d71;
      color: var(--text-main);
    }

    .btn-pick.selected {
      background: var(--accent-gold);
      color: #0a1120;
      font-weight: 900;
      border-color: var(--accent-gold);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(180deg, #fcd34d 0%, #fbbf24 100%);
      color: #0a1120;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 1.1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0 #b45309;
      transition: transform 0.1s ease;
    }

    .btn-submit:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b45309;
    }

    .status-alert {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="index.html" class="back-link">&larr; Back to Leaderboard</a>
      <h1 id="pageHeading">SUBMIT PICKS</h1>
      <p class="sub-header" id="pageSubHeading">Make your selections</p>
    </header>

    <div class="card-panel">
      <div class="user-input-group">
        <label for="userNameInput">Your Handle / Name:</label>
        <input type="text" id="userNameInput" placeholder="e.g. @BigAggie, CousinJohn22, Eric Smith" />
      </div>

      <div id="gamesList">
        <div style="text-align: center; color: var(--text-muted); padding: 2rem 0;">Loading schedule...</div>
      </div>

      <button type="button" class="btn-submit" onclick="submitBallot()">Submit Ballot</button>
      <div id="statusAlert" class="status-alert"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kxkctllysuxertyjjppd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DW2n3YQdAW6jEYNTP-Jm4Q_ejgFJ7nd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const targetWeek = parseInt(urlParams.get("week"), 10) || 1;

    const secCanonicalList = [
      "Alabama", "Arkansas", "Auburn", "Florida", "Georgia", "Kentucky",
      "LSU", "Ole Miss", "Mississippi State", "Missouri", "Oklahoma",
      "South Carolina", "Tennessee", "Texas", "Texas A&M", "Vanderbilt"
    ];

    const week1Games = [
      { id: 1, teamA: "Alabama", teamB: "Eastern Carolina", detail: "Tuscaloosa, AL" },
      { id: 2, teamA: "Arkansas", teamB: "North Alabama", detail: "Fayetteville, AR" },
      { id: 3, teamA: "Auburn", teamB: "Baylor", detail: "Auburn, AL" },
      { id: 4, teamA: "Florida", teamB: "Florida Atlantic", detail: "Gainesville, FL" },
      { id: 5, teamA: "Georgia", teamB: "Tenn State", detail: "Athens, GA" },
      { id: 6, teamA: "Kentucky", teamB: "Youngstown State", detail: "Lexington, KY" },
      { id: 7, teamA: "LSU", teamB: "Clemson", detail: "Baton Rouge, LA" },
      { id: 8, teamA: "Ole Miss", teamB: "Louisville", detail: "Oxford, MS" },
      { id: 9, teamA: "Miss State", teamB: "ULM", detail: "Starkville, MS" },
      { id: 10, teamA: "Missouri", teamB: "Peanutbutter", detail: "Columbia, MO" },
      { id: 11, teamA: "Oklahoma", teamB: "UTEP", detail: "Norman, OK" },
      { id: 12, teamA: "South Carolina", teamB: "Kent State", detail: "Columbia, SC" },
      { id: 13, teamA: "Tennessee", teamB: "Furman", detail: "Knoxville, TN" },
      { id: 14, teamA: "Texas", teamB: "Texas State", detail: "Austin, TX" },
      { id: 15, teamA: "Texas A&M", teamB: "Missouri State", detail: "College Station, TX" },
      { id: 16, teamA: "Vanderbilt", teamB: "Austin Peay", detail: "Nashville, TN" }
    ];

    let currentSchedule = [];
    let userSelections = {};

    function isSecTeam(teamName) {
      if (!teamName) return false;
      const lower = teamName.toLowerCase();
      return secCanonicalList.some(sec => lower.includes(sec.toLowerCase()));
    }

    async function fetchEspnSchedule(week) {
      try {
        const url = `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=8&seasontype=2&dates=2026&week=${week}&limit=100`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.events || data.events.length === 0) {
          return [];
        }

        const rawGames = [];

        data.events.forEach(ev => {
          const comp = ev.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === 'home');
          const away = comp.competitors.find(c => c.homeAway === 'away');

          const homeName = home.team.shortDisplayName || home.team.name;
          const awayName = away.team.shortDisplayName || away.team.name;

          // Always put the SEC team on the left (teamA)
          let teamA = homeName;
          let teamB = awayName;

          if (!isSecTeam(homeName) && isSecTeam(awayName)) {
            teamA = awayName;
            teamB = homeName;
          }

          const odds = comp.odds && comp.odds[0]?.details ? comp.odds[0].details : 'Line: TBD';
          const venue = comp.venue ? `${comp.venue.address.city}, ${comp.venue.address.state}` : '';
          
          let time = "TBD";
          if (comp.date) {
            time = new Date(comp.date).toLocaleDateString([], { month: 'numeric', day: 'numeric' }) + ' ' + 
                   new Date(comp.date).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          }

          rawGames.push({
            teamA: teamA,
            teamB: teamB,
            detail: `${time} | ${odds} | ${venue}`
          });
        });

        // Sort alphabetically by SEC team name (teamA)
        rawGames.sort((a, b) => a.teamA.localeCompare(b.teamA));

        // Reassign sequential Game IDs 1..N
        return rawGames.map((g, idx) => ({
          id: idx + 1,
          teamA: g.teamA,
          teamB: g.teamB,
          detail: g.detail
        }));

      } catch (e) {
        console.error("ESPN auto-fetch error:", e);
        return [];
      }
    }

    async function initForm() {
      document.getElementById("pageHeading").textContent = `WEEK ${targetWeek} PICKS`;
      document.getElementById("pageSubHeading").textContent = `Make your selections for Week ${targetWeek}`;

      if (targetWeek === 1) {
        currentSchedule = week1Games;
      } else {
        currentSchedule = await fetchEspnSchedule(targetWeek);
      }

      renderForm();
    }

    function renderForm() {
      const container = document.getElementById("gamesList");
      if (currentSchedule.length === 0) {
        container.innerHTML = `<div style="text-align:center; color: var(--danger); padding: 1.5rem 0;">No scheduled games found for Week ${targetWeek} yet.</div>`;
        return;
      }

      container.innerHTML = "";
      currentSchedule.forEach(g => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
          <span class="game-title">Game ${g.id}: ${g.teamA} vs ${g.teamB}</span>
          ${g.detail ? `<span class="game-detail">${g.detail}</span>` : ''}
          <div class="pick-grid">
            <button type="button" class="btn-pick" id="btn_${g.id}_A" onclick="chooseTeam(${g.id}, '${g.teamA}')">${g.teamA}</button>
            <button type="button" class="btn-pick" id="btn_${g.id}_B" onclick="chooseTeam(${g.id}, '${g.teamB}')">${g.teamB}</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function chooseTeam(gameId, team) {
      userSelections[gameId] = team;
      const btnA = document.getElementById(`btn_${gameId}_A`);
      const btnB = document.getElementById(`btn_${gameId}_B`);

      if (btnA.textContent.trim() === team) {
        btnA.classList.add("selected");
        btnB.classList.remove("selected");
      } else {
        btnB.classList.add("selected");
        btnA.classList.remove("selected");
      }
    }

    async function submitBallot() {
      const username = document.getElementById("userNameInput").value.trim();
      const statusAlert = document.getElementById("statusAlert");

      if (!username) {
        statusAlert.style.color = "var(--danger)";
        statusAlert.textContent = "Please enter your handle or name.";
        return;
      }

      if (Object.keys(userSelections).length < currentSchedule.length) {
        statusAlert.style.color = "var(--danger)";
        statusAlert.textContent = `Please make selections for all ${currentSchedule.length} games.`;
        return;
      }

      statusAlert.style.color = "var(--text-muted)";
      statusAlert.textContent = "Submitting your picks...";

      try {
        const { error } = await supabaseClient
          .from("picks")
          .insert({
            user_name: username,
            week_number: targetWeek,
            is_host: false,
            picks: userSelections,
            created_at: new Date().toISOString()
          });

        if (error) throw error;

        statusAlert.style.color = "var(--success)";
        statusAlert.innerHTML = `Week ${targetWeek} ballot submitted! Returning to Leaderboard...`;

        setTimeout(() => {
          window.location.href = `index.html`;
        }, 1800);
      } catch (err) {
        statusAlert.style.color = "var(--danger)";
        statusAlert.textContent = `Error: ${err.message}`;
      }
    }

    initForm();
  </script>
</body>
</html>
