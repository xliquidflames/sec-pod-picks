<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>That SEC Podcast Links</title>
  <style>
    :root {
      --bg-main: #0a1120;
      --bg-card: #131d31;
      --accent-gold: #fbbf24;
      --accent-gold-hover: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #22324f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .logo {
      max-width: 140px;
      height: auto;
      margin-bottom: 1rem;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.75rem;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
