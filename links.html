<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>That SEC Podcast Links</title>
  <style>
    :root {
      --bg-main: #0a1120;
      --bg-card: #131d31;
      --accent-gold: #fbbf24;
      --accent-gold-hover: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #22324f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .logo {
      max-width: 140px;
      height: auto;
      margin-bottom: 1rem;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.75rem;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn-link {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #fcd34d 0%, #fbbf24 100%);
      color: #0a1120;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 1.1rem 1rem;
      text-decoration: none;
      box-shadow: 0 4px 0 #b45309, 0 6px 16px rgba(251, 191, 36, 0.25);
      transition: all 0.15s ease;
    }

    .btn-link:hover {
      background: linear-gradient(180deg, #fde68a 0%, #f59e0b 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #b45309, 0 8px 20px rgba(251, 191, 36, 0.35);
    }

    .btn-link:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b45309;
    }

    .link-title {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .link-desc {
      font-size: 0.75rem;
      margin-top: 0.2rem;
      opacity: 0.9;
      font-weight: 700;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.png" alt="That SEC Podcast" class="logo" />
    
    <h1>Community Hub</h1>
    <p class="subtitle">Quick access for all Cousins</p>

    <div class="links-stack">
      <!-- 1. Official Website -->
      <a href="https://www.thatsecpodcast.com" class="btn-link" target="_blank" rel="noopener noreferrer">
        <span class="link-title">Official Website</span>
        <span class="link-desc">Episodes, show notes, and merchandise</span>
      </a>

      <!-- 2. Pick'em Site -->
      <a href="https://xliquidflames.github.io/sec-pod-picks/" class="btn-link" target="_blank" rel="noopener noreferrer">
        <span class="link-title">Pick'em Headquarters</span>
        <span class="link-desc">Submit weekly picks and view live leaderboard</span>
      </a>

      <!-- 3. Discord Community -->
      <a href="https://discord.gg/XsPnGkxFSM" class="btn-link" target="_blank" rel="noopener noreferrer">
        <span class="link-title">Official Discord</span>
        <span class="link-desc">Chat with Mike, Shane, and the Cousins</span>
      </a>

      <!-- 4. Fantasy League 
      <a href="https://college.fantasysports.yahoo.com/cfb/54217/invitation?key=0658ce26b9933165&ikey=49ec78a3cbfebd01&soc_src=app-sh" class="btn-link" target="_blank" rel="noopener noreferrer">
        <span class="link-title">Fantasy Football League</span>
        <span class="link-desc">Join the league, view matchups, and rosters</span>
      </a>
-->
    </div>

    <div class="footer">
      thatsecpodcast.com
    </div>
  </div>

</body>
</html>
