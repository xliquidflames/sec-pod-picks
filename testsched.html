<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Schedules - That SEC Podcast</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-alt: #162032;
      --accent-gold: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100dvh; display: flex; justify-content: center; padding: 1.5rem 1rem; }
    .container { width: 100%; max-width: 600px; text-align: center; margin-top: 3rem; }

    h1 { color: var(--accent-gold); font-size: 1.4rem; margin-bottom: 0.75rem; }
    p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    a.back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--accent-gold);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--accent-gold);
      border-radius: 20px;
      padding: 0.5rem 1.2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Team Schedules</h1>
    <p>This page is coming soon — a full season schedule and running win-loss record for every team, updated as games are played.</p>
    <div class="card">
      <p style="margin-bottom: 0;">Not built yet. The header link now goes somewhere real instead of a dead end while the actual feature gets put together.</p>
    </div>
    <a href="index.html" class="back-link">&larr; Back to Pick'em Headquarters</a>
  </div>
</body>
</html>
