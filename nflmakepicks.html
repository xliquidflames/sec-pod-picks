<!DOCTYPE html>
<html lang="en" class="page-nflmakepicks">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make Picks - NFL Pick'em</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=41"></script>
  <script src="common.js?v=43"></script>
  <script src="nfl.js?v=6"></script>
  <link rel="stylesheet" href="styles.css?v=45" />
</head>
<body>

  <div class="container narrow">
    <header>
      <a href="nflindex.html" class="back-link">&larr; Back to Leaderboard</a>
      <h1 id="pageHeading">SUBMIT PICKS</h1>
      <p class="sub-header" id="pageSubHeading">Make your selections</p>
    </header>

    <div class="pick-format-banner">
      <div class="pick-format-text">
        <span class="pick-format-highlight">Straight-Up Picks Only:</span> Select the outright winner for each game (not against the spread). Betting lines are shown for reference only.
      </div>
    </div>

    <div class="card">
      <div class="user-input-group">
        <label for="userNameInput">Your Name:</label>
        <div class="name-input-wrapper">
          <input type="text" class="form-field" id="userNameInput" placeholder="e.g., @CousinDan or GridironGuy99" data-site-attr="placeholder:e.g., @{one}Dan or GridironGuy99" autocomplete="off" required />
          <div id="nameSuggestions" class="name-suggestions"></div>
        </div>
        <div class="name-reminder">Checking your sign-in...</div>
      </div>

      <div id="gamesList">
        <div style="text-align: center; color: var(--text-muted); padding: 2rem 0;">Loading schedule...</div>
      </div>

      <button type="button" class="btn-submit" id="submitBtn" onclick="submitBallot()">Submit Ballot</button>
      <div id="statusAlert" class="status-alert"></div>
    </div>
  </div>

  <script>
    const targetWeek = parseInt(new URLSearchParams(window.location.search).get("week"), 10) || 1;

    let currentSchedule = [];
    let userSelections = {};
    let currentLockMatchupKey = null;
    let knownNames = [];

    async function fetchEspnSchedule(week) {
      try {
        const data = await (await fetch(scoreboardUrl(week))).json();
        if (!data.events || data.events.length === 0) return [];

        const games = [];
        data.events.forEach(ev => {
          // One malformed game is skipped instead of breaking the whole week.
          try {
            const comp = ev.competitions[0];
            const home = comp.competitors.find(c => c.homeAway === "home");
            const away = comp.competitors.find(c => c.homeAway === "away");
            const homeName = home.team.shortDisplayName || home.team.name || "";
            const awayName = away.team.shortDisplayName || away.team.name || "";

            const odds = comp.odds && comp.odds[0]?.details ? comp.odds[0].details : "Line: TBD";
            const venue = venueText(comp);

            let time = "TBD";
            let kickoff = new Date(8640000000000000);
            if (comp.date) {
              const d = new Date(comp.date);
              if (!isNaN(d.getTime())) kickoff = d;
              time = d.toLocaleDateString([], { weekday: "short", month: "numeric", day: "numeric" }) + " " +
                     d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            }

            // A game locks once it has started, not just when it's over.
            const type = comp.status && comp.status.type;
            const isFinal = !!((type && type.completed) || (type && type.state === "in") || (type && type.state === "post"));

            let winner = null, loser = null;
            if (isFinal) {
              if (away.winner === true) { winner = away; loser = home; }
              else if (home.winner === true) { winner = home; loser = away; }
            }

            games.push({
              matchupKey: (ev.id !== undefined && ev.id !== null) ? String(ev.id) : buildMatchupKey(awayName, homeName),
              teamA: awayName,
              teamB: homeName,
              logoA: nflLogoHtml(away.team, "btn-pick-logo"),
              logoB: nflLogoHtml(home.team, "btn-pick-logo"),
              kickoff,
              detail: `${time} | ${odds} | ${venue}`,
              playedDetail: `Played: ${time} | ${venue}`,
              isFinal,
              winnerName: winner ? (winner === away ? awayName : homeName) : null,
              loserName: loser ? (loser === away ? awayName : homeName) : null,
              winnerScore: winner ? winner.score : null,
              loserScore: loser ? loser.score : null
            });
          } catch (gameErr) {
            console.error(`Skipping one malformed game in week ${week}:`, gameErr, ev);
          }
        });

        games.sort((a, b) => a.kickoff - b.kickoff);
        games.forEach((g, idx) => { g.id = idx + 1; });
        return games;
      } catch (e) {
        console.error("ESPN auto-fetch error:", e);
        return [];
      }
    }

    async function initForm() {
      document.getElementById("pageHeading").textContent = `WEEK ${targetWeek} PICKS`;
      document.getElementById("pageSubHeading").textContent = `Make your selections for Week ${targetWeek}`;

      // Picks go in under the signed-in account's name.
      const account = await requireAccount();
      if (!account) return;
      showAccountName(account);

      currentSchedule = await fetchEspnSchedule(targetWeek);
      renderForm();
    }

    function renderForm() {
      const container = document.getElementById("gamesList");
      if (currentSchedule.length === 0) {
        container.innerHTML = `<div style="text-align:center; color: var(--danger); padding: 1.5rem 0;">No scheduled games found for Week ${targetWeek} yet.</div>`;
        return;
      }

      container.innerHTML = "";
      currentSchedule.forEach(g => {
        const card = document.createElement("div");
        card.id = `card_${g.matchupKey}`;

        if (g.isFinal) {
          card.className = "game-card is-final-locked";
          const resultText = g.winnerName
            ? `${g.winnerName} beat ${g.loserName} ${g.winnerScore}-${g.loserScore}.`
            : `${g.teamA} and ${g.teamB} tied.`;
          card.innerHTML = `
            <div class="game-header-row">
              <span class="game-title">Game ${g.id}</span>
            </div>
            <div class="final-logo-row">${g.logoA}<span class="pick-grid-at">@</span>${g.logoB}</div>
            <div class="game-final-message">Game has been played. ${resultText} Picking this game is locked.</div>
            ${g.playedDetail ? `<span class="game-detail">${g.playedDetail}</span>` : ""}
          `;
        } else {
          card.className = "game-card";
          card.innerHTML = `
            <div class="game-header-row">
              <span class="game-title">Game ${g.id}</span>
              <button type="button" class="btn-lock-toggle" id="lock_btn_${g.matchupKey}" onclick="toggleUserLock('${g.matchupKey}')">Lock Of\nThe Week</button>
            </div>
            <div class="pick-grid">
              <button type="button" class="btn-pick" id="btn_${g.matchupKey}_A" onclick="chooseTeam('${g.matchupKey}', '${g.teamA}')">${g.logoA}<span class="btn-pick-name">${g.teamA}</span></button>
              <span class="pick-grid-at">@</span>
              <button type="button" class="btn-pick" id="btn_${g.matchupKey}_B" onclick="chooseTeam('${g.matchupKey}', '${g.teamB}')">${g.logoB}<span class="btn-pick-name">${g.teamB}</span></button>
            </div>
            ${g.detail ? `<span class="game-detail">${g.detail}</span>` : ""}
          `;
        }
        container.appendChild(card);
      });
    }

    function chooseTeam(matchupKey, team) {
      userSelections[matchupKey] = team;
      markPick(matchupKey, btnA => btnA.textContent.trim() === team);
    }

    function toggleUserLock(matchupKey) {
      currentLockMatchupKey = (currentLockMatchupKey === matchupKey) ? null : matchupKey;
      refreshLockButtons(currentSchedule, currentLockMatchupKey, "Lock Of\nThe Week");
    }

    async function submitBallot() {
      const submitBtn = document.getElementById("submitBtn");
      const username = document.getElementById("userNameInput").value.trim();
      const fail = text => {
        setStatus("var(--danger)", text);
        resetSubmitButton();
      };

      if (!username) return setStatus("var(--danger)", "Please enter your handle or name.");

      // Games already started can't be picked, so they aren't required.
      const pickableGames = currentSchedule.filter(g => !g.isFinal);
      if (pickableGames.length === 0) {
        return setStatus("var(--danger)", "Every game this week has already been played — there's nothing left to submit picks for.");
      }

      const pickedGameCount = Object.keys(userSelections).filter(k => k !== "lock_matchup_key").length;
      if (pickedGameCount < pickableGames.length) {
        return setStatus("var(--danger)", `Please make selections for all ${pickableGames.length} remaining games.`);
      }

      if (!currentLockMatchupKey) return setStatus("var(--danger)", "Please select your Lock of the Week pick before submitting.");

      userSelections.lock_matchup_key = currentLockMatchupKey;

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting picks...";
      setStatus("var(--text-muted)", "Submitting your picks...");

      try {
        const { data: existing } = await supabaseClient
          .from(PICKS_TABLE)
          .select("id")
          .ilike("user_name", username)
          .eq("week_number", targetWeek)
          .limit(1);

        if (existing && existing.length > 0) {
          return fail(`An entry under "${username}" has already been submitted for Week ${targetWeek}! Only one submission per person is allowed.`);
        }

        const { error } = await supabaseClient
          .from(PICKS_TABLE)
          .insert({
            user_name: username,
            week_number: targetWeek,
            picks: userSelections,
            created_at: new Date().toISOString()
          });

        if (error) {
          if (error.code === "23505" || error.message?.includes("unique")) {
            return fail(`An entry under "${username}" was already submitted for Week ${targetWeek}!`);
          }
          throw error;
        }

        setStatus("var(--success)", `Week ${targetWeek} ballot submitted! Returning to Leaderboard...`);
        setTimeout(() => { window.location.href = "nflindex.html"; }, 1800);
      } catch (err) {
        fail(`Error: ${err.message}`);
      }
    }

    initForm();
  </script>
</body>
</html>
