<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Picks Portal - That SEC Podcast</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0a1120;
      --bg-card: #131d31;
      --bg-card-inner: #19263e;
      --accent-gold: #f59e0b;
      --accent-gold-hover: #d97706;
      --accent-gold-bright: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #22324f;
      --success: #4ade80;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 550px;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    .sub-header {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .card-panel {
      background: var(--bg-card);
      padding: 1.25rem;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    /* Submitting Header Banner */
    .submitting-bar {
      background: #0d1527;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .submitting-label {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .host-select {
      background: transparent;
      color: var(--accent-gold-bright);
      font-size: 1.1rem;
      font-weight: 800;
      border: none;
      outline: none;
      cursor: pointer;
      text-align: right;
    }

    .host-select option {
      background: #0d1527;
      color: var(--text-main);
    }

    /* Game Matchup Cards */
    .game-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card.is-locked {
      border: 1.5px solid var(--accent-gold-bright);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
    }

    .game-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .game-title {
      color: var(--accent-gold-bright);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* In-Card Lock Toggle Button */
    .btn-lock-toggle {
      background: #0e1728;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .btn-lock-toggle:hover {
      border-color: var(--accent-gold);
      color: var(--text-main);
    }

    .btn-lock-toggle.active {
      background: var(--accent-gold-bright);
      color: #0a1120;
      border-color: var(--accent-gold-bright);
      font-weight: 900;
    }

    /* Pick Buttons Grid */
    .pick-buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .btn-pick {
      background: #0e1728;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 0.85rem 0.5rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-pick:hover {
      border-color: #3b4d71;
      color: var(--text-main);
    }

    .btn-pick.selected {
      background: var(--accent-gold-bright);
      color: #0a1120;
      font-weight: 900;
      border-color: var(--accent-gold-bright);
    }

    /* Submit CTA */
    .btn-save-all {
      width: 100%;
      background: linear-gradient(180deg, #fcd34d 0%, #fbbf24 100%);
      color: #0a1120;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 1.1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0 #b45309;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-save-all:hover {
      background: linear-gradient(180deg, #fde68a 0%, #f59e0b 100%);
    }

    .btn-save-all:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b45309;
    }

    .status-alert {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>THAT SEC PODCAST</h1>
      <p class="sub-header">Host Portal (Week 1)</p>
    </header>

    <div class="card-panel">
      <!-- Submitting As Banner -->
      <div class="submitting-bar">
        <span class="submitting-label">Submitting as:</span>
        <select class="host-select" id="hostSelect" onchange="onHostSelectChange()">
          <option value="Mike">Mike</option>
          <option value="Shane">Shane</option>
          <option value="Steven">Steven</option>
        </select>
      </div>

      <!-- Matchup Cards Container -->
      <div id="gamesContainer"></div>

      <!-- Save Button -->
      <button type="button" class="btn-save-all" onclick="saveHostSelections()">Save Host Picks</button>
      <div id="statusAlert" class="status-alert"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kxkctllysuxertyjjppd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DW2n3YQdAW6jEYNTP-Jm4Q_ejgFJ7nd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const week1Games = [
      { id: 1, teamA: "Alabama", teamB: "Eastern Carolina" },
      { id: 2, teamA: "Arkansas", teamB: "North Alabama" },
      { id: 3, teamA: "Auburn", teamB: "Baylor" },
      { id: 4, teamA: "Florida", teamB: "Florida Atlantic" },
      { id: 5, teamA: "Georgia", teamB: "Tenn State" },
      { id: 6, teamA: "Kentucky", teamB: "Youngstown State" },
      { id: 7, teamA: "LSU", teamB: "Clemson" },
      { id: 8, teamA: "Ole Miss", teamB: "Louisville" },
      { id: 9, teamA: "Miss State", teamB: "ULM" },
      { id: 10, teamA: "Missouri", teamB: "Peanutbutter" },
      { id: 11, teamA: "Oklahoma", teamB: "UTEP" },
      { id: 12, teamA: "South Carolina", teamB: "Kent State" },
      { id: 13, teamA: "Tennessee", teamB: "Furman" },
      { id: 14, teamA: "Texas", teamB: "Texas State" },
      { id: 15, teamA: "Texas A&M", teamB: "Missouri State" },
      { id: 16, teamA: "Vanderbilt", teamB: "Austin Peay" }
    ];

    let hostPicks = {};
    let currentLockGameId = null;

    function renderCards() {
      const container = document.getElementById("gamesContainer");
      container.innerHTML = "";

      week1Games.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.id = `card_${game.id}`;

        card.innerHTML = `
          <div class="game-header-row">
            <span class="game-title">GAME ${game.id}: ${game.teamA} VS ${game.teamB}</span>
            <button type="button" class="btn-lock-toggle" id="lock_btn_${game.id}" onclick="toggleLock(${game.id})">
              Lock of Week
            </button>
          </div>
          <div class="pick-buttons-grid">
            <button type="button" class="btn-pick" id="btn_${game.id}_A" onclick="selectTeam(${game.id}, '${game.teamA}')">
              ${game.teamA}
            </button>
            <button type="button" class="btn-pick" id="btn_${game.id}_B" onclick="selectTeam(${game.id}, '${game.teamB}')">
              ${game.teamB}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectTeam(gameId, teamName) {
      hostPicks[gameId] = teamName;
      const btnA = document.getElementById(`btn_${gameId}_A`);
      const btnB = document.getElementById(`btn_${gameId}_B`);

      if (btnA.textContent.trim() === teamName) {
        btnA.classList.add("selected");
        btnB.classList.remove("selected");
      } else {
        btnB.classList.add("selected");
        btnA.classList.remove("selected");
      }
    }

    function toggleLock(gameId) {
      if (currentLockGameId === gameId) {
        currentLockGameId = null;
      } else {
        currentLockGameId = gameId;
      }
      refreshLockVisuals();
    }

    function refreshLockVisuals() {
      week1Games.forEach(game => {
        const card = document.getElementById(`card_${game.id}`);
        const lockBtn = document.getElementById(`lock_btn_${game.id}`);

        if (currentLockGameId === game.id) {
          card.classList.add("is-locked");
          lockBtn.classList.add("active");
          lockBtn.textContent = "★ Lock Selected";
        } else {
          card.classList.remove("is-locked");
          lockBtn.classList.remove("active");
          lockBtn.textContent = "Lock of Week";
        }
      });
    }

    function onHostSelectChange() {
      hostPicks = {};
      currentLockGameId = null;
      document.querySelectorAll(".btn-pick").forEach(btn => btn.classList.remove("selected"));
      document.getElementById("statusAlert").textContent = "";
      refreshLockVisuals();
      fetchHostData();
    }

    async function fetchHostData() {
      const hostName = document.getElementById("hostSelect").value;
      try {
        const { data, error } = await supabaseClient
          .from("picks")
          .select("*")
          .eq("week_number", 1)
          .eq("user_name", hostName)
          .maybeSingle();

        if (error) throw error;

        if (data && data.picks) {
          const raw = typeof data.picks === 'object' ? data.picks : JSON.parse(data.picks);
          hostPicks = { ...raw };

          week1Games.forEach(g => {
            const team = hostPicks[g.id] || hostPicks[String(g.id)];
            if (team) {
              selectTeam(g.id, team);
            }
          });

          if (hostPicks.lock_game_id) {
            currentLockGameId = parseInt(hostPicks.lock_game_id, 10);
            refreshLockVisuals();
          }
        }
      } catch (e) {
        console.error("Error fetching host data:", e);
      }
    }

    async function saveHostSelections() {
  const hostName = document.getElementById("hostSelect").value;
  const statusAlert = document.getElementById("statusAlert");

  const pickedKeys = Object.keys(hostPicks).filter(k => k !== 'lock_game_id');
  if (pickedKeys.length < week1Games.length) {
    statusAlert.style.color = "var(--danger)";
    statusAlert.textContent = "Please pick all 16 games before saving.";
    return;
  }

  hostPicks.lock_game_id = currentLockGameId;

  try {
    statusAlert.style.color = "var(--text-muted)";
    statusAlert.textContent = "Saving...";

    // 1. Check if this host already has an entry for Week 1
    const { data: existing, error: checkError } = await supabaseClient
      .from("picks")
      .select("id")
      .eq("week_number", 1)
      .eq("user_name", hostName)
      .maybeSingle();

    if (checkError) throw checkError;

    let saveError = null;

    if (existing && existing.id) {
      // 2. Update existing row
      const { error } = await supabaseClient
        .from("picks")
        .update({
          is_host: true,
          picks: hostPicks,
          created_at: new Date().toISOString()
        })
        .eq("id", existing.id);

      saveError = error;
    } else {
      // 3. Insert new row
      const { error } = await supabaseClient
        .from("picks")
        .insert({
          user_name: hostName,
          week_number: 1,
          is_host: true,
          picks: hostPicks,
          created_at: new Date().toISOString()
        });

      saveError = error;
    }

    if (saveError) throw saveError;

    statusAlert.style.color = "var(--success)";
    statusAlert.textContent = `All 16 picks & Lock saved successfully for ${hostName}!`;
  } catch (err) {
    statusAlert.style.color = "var(--danger)";
    statusAlert.textContent = `Error: ${err.message}`;
  }
}


    renderCards();
    fetchHostData();
  </script>
</body>
</html>
