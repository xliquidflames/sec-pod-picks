<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Picks Portal - That SEC Podcast</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-alt: #162032;
      --accent-gold: #fbbf24;
      --accent-gold-hover: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #4ade80;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .logo-container {
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      margin-bottom: 0.25rem;
    }

    .sub-header {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    select, input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    select:focus, input[type="password"]:focus {
      border-color: var(--accent-gold);
    }

    .matchup-item {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .matchup-header {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent-gold);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .team-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .team-option {
      position: relative;
    }

    .team-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .team-option label {
      display: block;
      background: #1e293b;
      border: 1px solid var(--border-color);
      padding: 0.75rem 0.5rem;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0;
      transition: all 0.15s ease;
      color: var(--text-muted);
    }

    .team-option input[type="radio"]:checked + label {
      background: var(--accent-gold);
      color: #0f172a;
      border-color: var(--accent-gold);
      font-weight: 800;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(180deg, #fcd34d 0%, #fbbf24 100%);
      color: #0f172a;
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      padding: 1.1rem;
      border-radius: 10px;
      border: 1px solid #fde68a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b45309, 0 8px 20px rgba(251, 191, 36, 0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      margin-top: 1rem;
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #fde68a 0%, #f59e0b 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #b45309, 0 12px 24px rgba(251, 191, 36, 0.45);
    }

    .btn-submit:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b45309, 0 4px 10px rgba(251, 191, 36, 0.3);
    }

    .btn-back {
      display: block;
      text-align: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-top: 1.25rem;
    }

    .btn-back:hover {
      color: var(--text-main);
    }

    .error-msg {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <h1>THAT SEC PODCAST</h1>
      </div>
      <p class="sub-header">Host Portal (Week 1)</p>
    </header>

    <div class="card">
      <div id="errorBox" class="error-msg"></div>

      <form id="hostPickForm">
        <div class="form-group">
          <label for="hostSelect">Select Host Name</label>
          <select id="hostSelect" required>
            <option value="" disabled selected>Choose your name...</option>
            <option value="Mike">Mike</option>
            <option value="Shane">Shane</option>
            <option value="Steven">Steven</option>
          </select>
        </div>

        <div class="form-group">
          <label for="hostPin">Host PIN</label>
          <input type="password" id="hostPin" placeholder="Enter Host PIN" required />
        </div>

        <div id="matchupsContainer"></div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit Host Picks</button>
      </form>

      <a href="index.html" class="btn-back">&larr; Back to Leaderboard</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kxkctllysuxertyjjppd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DW2n3YQdAW6jEYNTP-Jm4Q_ejgFJ7nd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const HOST_PIN = "1998";

    const week1Games = [
      { id: 1, teamA: "Alabama", teamB: "Eastern Carolina" },
      { id: 2, teamA: "Arkansas", teamB: "North Alabama" },
      { id: 3, teamA: "Auburn", teamB: "Baylor" },
      { id: 4, teamA: "Florida", teamB: "Florida Atlantic" },
      { id: 5, teamA: "Georgia", teamB: "Tenn State" },
      { id: 6, teamA: "Kentucky", teamB: "Youngstown State" },
      { id: 7, teamA: "LSU", teamB: "Clemson" },
      { id: 8, teamA: "Ole Miss", teamB: "Louisville" },
      { id: 9, teamA: "Miss State", teamB: "ULM" },
      { id: 10, teamA: "Missouri", teamB: "Peanutbutter" },
      { id: 11, teamA: "Oklahoma", teamB: "UTEP" },
      { id: 12, teamA: "South Carolina", teamB: "Kent State" },
      { id: 13, teamA: "Tennessee", teamB: "Furman" },
      { id: 14, teamA: "Texas", teamB: "Texas State" },
      { id: 15, teamA: "Texas A&M", teamB: "Missouri State" },
      { id: 16, teamA: "Vanderbilt", teamB: "Austin Peay" }
    ];

    function renderGames() {
      const container = document.getElementById("matchupsContainer");
      container.innerHTML = "";

      week1Games.forEach(game => {
        const div = document.createElement("div");
        div.className = "matchup-item";
        div.innerHTML = `
          <div class="matchup-header">Game ${game.id}: ${game.teamA} vs ${game.teamB}</div>
          <div class="team-options">
            <div class="team-option">
              <input type="radio" id="g${game.id}_a" name="game_${game.id}" value="${game.teamA}" required>
              <label for="g${game.id}_a">${game.teamA}</label>
            </div>
            <div class="team-option">
              <input type="radio" id="g${game.id}_b" name="game_${game.id}" value="${game.teamB}">
              <label for="g${game.id}_b">${game.teamB}</label>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    document.getElementById("hostPickForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("errorBox");
      const hostName = document.getElementById("hostSelect").value;
      const hostPin = document.getElementById("hostPin").value.trim();

      errorBox.style.display = "none";

      if (hostPin !== HOST_PIN) {
        errorBox.textContent = "Incorrect Host PIN.";
        errorBox.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      const userPicks = {};
      week1Games.forEach(game => {
        const selected = document.querySelector(`input[name="game_${game.id}"]:checked`);
        if (selected) {
          userPicks[game.id] = selected.value;
        }
      });

      try {
        const { error } = await supabaseClient
          .from("picks")
          .upsert(
            [
              {
                user_name: hostName,
                week_number: 1,
                picks: userPicks,
                is_host: true
              }
            ],
            { onConflict: "user_name,week_number" }
          );

        if (error) {
          const { insertError } = await supabaseClient
            .from("picks")
            .insert([
              {
                user_name: hostName,
                week_number: 1,
                picks: userPicks,
                is_host: true
              }
            ]);
          if (insertError) throw insertError;
        }

        window.location.href = "index.html";
      } catch (err) {
        errorBox.textContent = "Submission failed: " + err.message;
        errorBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Host Picks";
      }
    });

    renderGames();
  </script>
</body>
</html>
