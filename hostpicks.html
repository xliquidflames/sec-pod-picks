<!DOCTYPE html>
<html lang="en" class="page-hostpicks">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-site-text="Host Portal - {name}">Host Portal - That SEC Podcast</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=41"></script>
  <script src="common.js?v=44"></script>
  <script src="sec.js?v=40"></script>
  <link rel="stylesheet" href="styles.css?v=46" />
</head>
<body>

  <div class="container narrow">
    <header>
      <a href="index.html" class="back-link">&larr; Back to Leaderboard</a>
      <h1>HOST PICKS PORTAL</h1>
      <p class="sub-header" id="portalSubHeading">Week 1 Picks, Scores & Lock Submission</p>
    </header>

    <div class="card">
      <div class="controls-grid">
        <div class="control-group">
          <label for="weekSelect">Select Week:</label>
          <select class="form-field" id="weekSelect" onchange="onWeekChange()">
            <option value="1">Week 1</option>
            <option value="2">Week 2</option>
            <option value="3">Week 3</option>
            <option value="4">Week 4</option>
            <option value="5">Week 5</option>
            <option value="6">Week 6</option>
            <option value="7">Week 7</option>
            <option value="8">Week 8</option>
            <option value="9">Week 9</option>
            <option value="10">Week 10</option>
            <option value="11">Week 11</option>
            <option value="12">Week 12</option>
            <option value="13">Week 13</option>
            <option value="14">Week 14</option>
          </select>
        </div>

        <div class="control-group">
          <label for="hostSelect">Submitting As:</label>
          <select class="form-field" id="hostSelect" onchange="onHostChange()">
            <!-- Filled from the hosts in config.js. -->
          </select>
        </div>
      </div>

      <div class="name-reminder" id="hostAccount" style="margin-bottom: 1rem;">Checking your sign-in...</div>

      <div id="gamesContainer">
        <div style="text-align: center; color: var(--text-muted); padding: 2rem 0;">Loading schedule...</div>
      </div>

      <button type="button" class="btn-submit" id="saveHostBtn" onclick="saveHostSelections()">Save Host Picks</button>
      <div id="statusAlert" class="status-alert"></div>
    </div>
  </div>

  <script>
    document.getElementById("hostSelect").innerHTML =
      SITE.hosts.map(h => `<option value="${h}">${h}</option>`).join("");

    let currentSchedule = [];
    let hostPicks = {};
    let hostScores = {};
    let currentLockMatchupKey = null;
    let restoring = false;  // true while filling in saved data, so it isn't counted as a new change
    let unsaved = false;

    // Every tap and score is kept on this phone until it's saved, so going
    // back or closing the tab doesn't lose it.
    function draftKey() {
      return `hostDraft:${document.getElementById("hostSelect").value}:${document.getElementById("weekSelect").value}`;
    }
    function saveDraft() {
      if (restoring) return;
      unsaved = true;
      const picks = {};
      Object.keys(hostPicks).forEach(k => { if (!NON_PICK_KEYS.includes(k)) picks[k] = hostPicks[k]; });
      try {
        localStorage.setItem(draftKey(), JSON.stringify({ picks, scores: hostScores, lock: currentLockMatchupKey }));
      } catch (_) {}
    }
    function clearDraft() {
      unsaved = false;
      try { localStorage.removeItem(draftKey()); } catch (_) {}
    }
    function loadDraft() {
      try { return JSON.parse(localStorage.getItem(draftKey()) || "null"); } catch (_) { return null; }
    }
    window.addEventListener("beforeunload", e => {
      if (unsaved) { e.preventDefault(); e.returnValue = ""; }
    });

    async function fetchEspnSchedule(week) {
      try {
        const data = await (await fetch(scoreboardUrl(week))).json();
        if (!data.events || data.events.length === 0) return [];

        const games = data.events.map(ev => {
          const comp = ev.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === "home");
          const away = comp.competitors.find(c => c.homeAway === "away");
          const homeName = cleanTeamName(home.team.shortDisplayName || home.team.name);
          const awayName = cleanTeamName(away.team.shortDisplayName || away.team.name);

          // teamA is always the SEC team (home if both are). Matchup keys,
          // saved picks and predicted scores all use this order.
          const [teamA, teamB] = isSecTeam(homeName) ? [homeName, awayName] : [awayName, homeName];

          const isFinal = comp.status && comp.status.type && comp.status.type.completed;
          const odds = comp.odds && comp.odds[0]?.details ? comp.odds[0].details : "Line: TBD";
          const venue = venueText(comp);

          let time = "TBD";
          let kickoff = new Date(8640000000000000);
          if (isFinal) {
            time = `Final: ${away.team.abbreviation || awayName} ${away.score} - ${home.team.abbreviation || homeName} ${home.score}`;
          } else if (comp.date) {
            time = new Date(comp.date).toLocaleDateString([], { month: "numeric", day: "numeric" }) + " " +
                   new Date(comp.date).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
          }
          if (comp.date) {
            const kd = new Date(comp.date);
            if (!isNaN(kd.getTime())) kickoff = kd;
          }

          return {
            matchupKey: (ev.id !== undefined && ev.id !== null) ? String(ev.id) : buildMatchupKey(teamA, teamB),
            teamA,
            teamB,
            kickoff,
            detail: isFinal ? `${time} | ${venue}` : `${time} | ${odds} | ${venue}`,
            awayName,
            homeName
          };
        });

        games.sort((a, b) => a.kickoff - b.kickoff);
        games.forEach((g, idx) => { g.id = idx + 1; });
        return games;
      } catch (e) {
        console.error("ESPN schedule error:", e);
        return [];
      }
    }

    async function loadSchedule() {
      const weekNum = parseInt(document.getElementById("weekSelect").value, 10);
      document.getElementById("portalSubHeading").textContent = `Week ${weekNum} Picks, Scores & Lock Submission`;
      currentSchedule = await fetchEspnSchedule(weekNum);
      renderCards();
      await fetchExistingHostData();
    }

    function renderCards() {
      const container = document.getElementById("gamesContainer");
      if (currentSchedule.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 1.5rem 0;">No scheduled games found for this week.</div>`;
        return;
      }

      container.innerHTML = "";
      currentSchedule.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.id = `card_${game.matchupKey}`;

        const pickBtn = (side, team) => `
            <button type="button" class="btn-pick" id="btn_${game.matchupKey}_${side}" data-team="${team}" onclick="selectTeam('${game.matchupKey}', '${team}')">
              ${shortenPickDisplay(team)}
            </button>`;
        const scoreBox = (side, team) => `
            <div class="score-group">
              <span class="score-label">${team} Score</span>
              <input type="number" min="0" max="99" class="score-field" id="score_${game.matchupKey}_${side}" placeholder="--" oninput="onScoreInput('${game.matchupKey}', '${game.teamA}', '${game.teamB}')" />
            </div>`;

        // Shown in real "Away @ Home" order; ids and saved data stay A/B.
        const teamAIsHome = normalizeTeam(game.teamA) === normalizeTeam(game.homeName);
        const [left, right] = teamAIsHome ? ["B", "A"] : ["A", "B"];
        const teamOf = side => side === "A" ? game.teamA : game.teamB;

        card.innerHTML = `
          <div class="game-header-row">
            <span class="game-title"><strong>GAME ${game.id}</strong></span>
            <button type="button" class="btn-lock-toggle" id="lock_btn_${game.matchupKey}" onclick="toggleLock('${game.matchupKey}')">
              Lock of Week
            </button>
          </div>
          <div class="pick-grid">
            ${pickBtn(left, teamOf(left))}
            <span class="pick-grid-at">@</span>
            ${pickBtn(right, teamOf(right))}
          </div>
          ${game.detail ? `<span class="game-detail">${game.detail}</span>` : ""}
          <div class="score-inputs-grid">
            ${scoreBox(left, teamOf(left))}
            ${scoreBox(right, teamOf(right))}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectTeam(matchupKey, teamName) {
      hostPicks[matchupKey] = teamName;
      markPick(matchupKey, btnA => btnA.dataset.team === teamName);
      saveDraft();
    }

    // Typing both scores picks the team with the higher one.
    function onScoreInput(matchupKey, teamA, teamB) {
      const valA = document.getElementById(`score_${matchupKey}_A`).value;
      const valB = document.getElementById(`score_${matchupKey}_B`).value;
      hostScores[matchupKey] = { ...hostScores[matchupKey], teamA: valA, teamB: valB };

      const numA = parseInt(valA, 10);
      const numB = parseInt(valB, 10);
      if (!isNaN(numA) && !isNaN(numB)) {
        if (numA > numB) selectTeam(matchupKey, teamA);
        else if (numB > numA) selectTeam(matchupKey, teamB);
      }
      saveDraft();
    }

    function toggleLock(matchupKey) {
      currentLockMatchupKey = (currentLockMatchupKey === matchupKey) ? null : matchupKey;
      refreshLockVisuals();
      saveDraft();
    }

    function refreshLockVisuals() {
      refreshLockButtons(currentSchedule, currentLockMatchupKey, "Lock of Week");
    }

    function resetHostState() {
      hostPicks = {};
      hostScores = {};
      currentLockMatchupKey = null;
      unsaved = false;
      document.getElementById("statusAlert").textContent = "";
    }

    function onWeekChange() {
      resetHostState();
      loadSchedule();
    }

    function onHostChange() {
      resetHostState();
      document.querySelectorAll(".btn-pick").forEach(btn => btn.classList.remove("selected"));
      document.querySelectorAll(".score-field").forEach(inp => inp.value = "");
      refreshLockVisuals();
      fetchExistingHostData();
    }

    // Loads this host's saved picks for the week. Older entries may be keyed
    // by game number or team names instead of ESPN's event id.
    async function fetchExistingHostData() {
      const hostName = document.getElementById("hostSelect").value;
      const weekNum = parseInt(document.getElementById("weekSelect").value, 10);

      restoring = true;
      try {
        const { data, error } = await supabaseClient
          .from(PICKS_TABLE)
          .select("*")
          .eq("week_number", weekNum)
          .eq("user_name", hostName)
          .maybeSingle();
        if (error) throw error;
        if (!data || !data.picks) return;

        const raw = typeof data.picks === "object" ? data.picks : JSON.parse(data.picks);
        hostPicks = { ...raw };
        hostScores = raw.scores || {};

        currentSchedule.forEach(g => {
          const aNorm = normalizeTeam(g.teamA);
          const bNorm = normalizeTeam(g.teamB);

          let team = hostPicks[g.matchupKey] || hostPicks[g.id] || hostPicks[String(g.id)];
          if (!team) {
            const matchKey = Object.keys(hostPicks).find(k => {
              if (NON_PICK_KEYS.includes(k)) return false;
              const vNorm = normalizeTeam(hostPicks[k]);
              return vNorm === aNorm || vNorm === bNorm;
            });
            if (matchKey) team = hostPicks[matchKey];
          }
          if (team) selectTeam(g.matchupKey, team);

          const gScore = hostScores[g.matchupKey] || hostScores[g.id] || hostScores[String(g.id)];
          if (gScore) {
            const inpA = document.getElementById(`score_${g.matchupKey}_A`);
            const inpB = document.getElementById(`score_${g.matchupKey}_B`);
            if (inpA && gScore.teamA !== undefined) inpA.value = gScore.teamA;
            if (inpB && gScore.teamB !== undefined) inpB.value = gScore.teamB;
          }
        });

        if (hostPicks.lock_matchup_key) {
          currentLockMatchupKey = hostPicks.lock_matchup_key;
          refreshLockVisuals();
        } else if (hostPicks.lock_game_id) {
          const foundGame = currentSchedule.find(g => g.id === parseInt(hostPicks.lock_game_id, 10));
          if (foundGame) {
            currentLockMatchupKey = foundGame.matchupKey;
            refreshLockVisuals();
          }
        }
      } catch (e) {
        console.error("Error fetching host data:", e);
      } finally {
        restoring = false;
        restoreDraft();
      }
    }

    // Puts back anything entered on this phone but not saved yet.
    function restoreDraft() {
      const draft = loadDraft();
      if (!draft) return;
      restoring = true;
      currentSchedule.forEach(g => {
        const team = draft.picks && draft.picks[g.matchupKey];
        if (team) selectTeam(g.matchupKey, team);
        const sc = draft.scores && draft.scores[g.matchupKey];
        if (sc) {
          hostScores[g.matchupKey] = { ...hostScores[g.matchupKey], ...sc };
          const inpA = document.getElementById(`score_${g.matchupKey}_A`);
          const inpB = document.getElementById(`score_${g.matchupKey}_B`);
          if (inpA && sc.teamA !== undefined) inpA.value = sc.teamA;
          if (inpB && sc.teamB !== undefined) inpB.value = sc.teamB;
        }
      });
      currentLockMatchupKey = draft.lock || null;
      refreshLockVisuals();
      restoring = false;
      unsaved = true;
      setStatus("var(--accent-gold)", "Restored entries that weren't saved yet. Tap Save to keep them.");
    }

    // Saving again for the same host and week overwrites the earlier entry.
    async function saveHostSelections() {
      const hostName = document.getElementById("hostSelect").value;
      const weekNum = parseInt(document.getElementById("weekSelect").value, 10);

      currentSchedule.forEach(g => {
        const inpA = document.getElementById(`score_${g.matchupKey}_A`);
        const inpB = document.getElementById(`score_${g.matchupKey}_B`);
        if (inpA && inpB && inpA.value !== "" && inpB.value !== "") {
          hostScores[g.matchupKey] = { ...hostScores[g.matchupKey], teamA: inpA.value, teamB: inpB.value };
        }
      });

      hostPicks.lock_matchup_key = currentLockMatchupKey;
      hostPicks.scores = hostScores;

      setStatus("var(--text-muted)", "Saving...");

      // The database checks that this account may save host picks.
      try {
        const { error } = await supabaseClient.rpc("save_host_picks", {
          p_name: hostName, p_week: weekNum, p_picks: hostPicks
        });
        if (error) throw error;

        clearDraft();
        const picked = currentSchedule.filter(g => hostPicks[g.matchupKey]).length;
        setStatus("var(--success)", `Saved ${picked} of ${currentSchedule.length} picks for ${hostName}, Week ${weekNum}.`);
      } catch (err) {
        setStatus("var(--danger)", `Error: ${err.message}`);
      }
    }

    // Hosts move to the next week on the Monday after its last game ends
    // (a day before the public leaderboard).
    (async () => {
      // Only accounts listed as site admins in the database can save.
      const account = await requireAccount();
      if (!account) return;
      const { data: isAdmin } = await supabaseClient.rpc("is_site_admin");
      const signOutLink = `<a href="#" onclick="signOut('hostpicks.html'); return false;">Sign out</a>`;
      document.getElementById("hostAccount").innerHTML = isAdmin
        ? `Saving as <strong>${account.name}</strong> · ${signOutLink}`
        : `<strong>${account.name}</strong> can't save host picks. ${signOutLink}`;
      document.getElementById("saveHostBtn").disabled = !isAdmin;

      const week = await determineActiveWeek(lastKickoff => nextDayStart(new Date(lastKickoff.getTime() + 4 * 60 * 60 * 1000), 1));
      document.getElementById("weekSelect").value = String(week);
      loadSchedule();
    })();
  </script>
</body>
</html>
